<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铁柱笔记 · 小说下载</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f6f4; color: #222; padding: 20px 16px 60px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input[type=url] { width: 100%; padding: 12px; font-size: 15px; border: 1.5px solid #ddd; border-radius: 8px; outline: none; }
  input[type=url]:focus { border-color: #222; }
  button { width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; font-weight: 600; color: #fff; background: #222; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #aaa; cursor: wait; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row button { width: auto; margin-top: 0; }
  .btn-paste { flex: 1; }
  .btn-clear { flex: 0 0 auto; padding: 13px 18px; background: #eee; color: #555; }
  #status { margin-top: 12px; font-size: 14px; line-height: 1.6; color: #555; white-space: pre-wrap; word-break: break-all; }
  #status.ok { color: #1a7f37; }
  #status.err { color: #c0392b; }
  h2 { font-size: 16px; margin: 4px 0 10px; }
  .hint { font-size: 12px; color: #999; margin-top: 12px; line-height: 1.6; }
  .hist-head { display: flex; justify-content: space-between; align-items: baseline; }
  .hist-clear { font-size: 12px; color: #999; background: none; border: none; cursor: pointer; padding: 0; width: auto; margin: 0; }
  .hist-day { font-size: 13px; font-weight: 700; color: #888; margin: 14px 0 4px; }
  .hist-item { display: flex; gap: 8px; align-items: flex-start; padding: 9px 0; border-top: 1px solid #eee; }
  .hist-title { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .hist-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .hist-empty { font-size: 13px; color: #999; padding: 8px 0; }
  .inapp-tip { background: #fff7e0; border: 1.5px solid #f0c96a; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #7a5b00; margin-bottom: 16px; gap: 8px; align-items: flex-start; }
  .inapp-tip button { width: auto; margin: 0; padding: 0 2px; background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; color: #7a5b00; flex-shrink: 0; }
</style>
</head>
<body>
  <div id="inappTip" class="inapp-tip" style="display:none">
    <span id="inappTipText"></span>
    <button id="inappTipClose" aria-label="关闭">×</button>
  </div>
  <h1>📚 铁柱笔记 · 小说下载</h1>
  <p class="sub">番茄小说短篇 · 粘贴分享链接 → 下载全文 txt</p>

  <div class="card">
    <label for="link">分享链接</label>
    <input id="link" type="url" placeholder="粘贴分享链接，带推荐语也没关系，会自动识别…" autocomplete="off">
    <div class="row">
      <button id="paste" class="btn-paste" type="button">📋 粘贴并下载</button>
      <button id="clear" class="btn-clear" type="button">✕ 清除</button>
    </div>
    <button id="dl">下载全文</button>
    <div id="status"></div>
    <p class="hint">直接点「粘贴并下载」就行，不用点输入框，自动读剪贴板开始下载；也可以手动粘贴链接或带链接的一段话，会自动识别。几秒出全文，自动存为「小说名_作者名.txt」。纯下载，不用登录、不用密码。</p>
  </div>

  <div class="card">
    <div class="hist-head"><h2>下载记录</h2><button class="hist-clear" id="clearHist">清空</button></div>
    <div id="hist"></div>
  </div>

<script>
// ★ 部署好 Cloudflare Worker 后，把它的地址填到这里，例如：
// const WORKER_URL = 'https://tiezhu-novel.<你的子域>.workers.dev/';
const WORKER_URL = 'https://tiezhu-novel.xianmei2022.workers.dev/';

const $ = (id) => document.getElementById(id);

// QQ/微信内置浏览器存不了文件，提示去系统浏览器打开
(function () {
  const ua = navigator.userAgent || '';
  const app = /MicroMessenger/i.test(ua) ? '微信' : (/QQ\/|MQQBrowser/i.test(ua) ? 'QQ' : '');
  if (!app) return;
  const tip = $('inappTip');
  $('inappTipText').textContent = '检测到你在' + app + '里打开：' + app + '内置浏览器存不了文件，下载会卡住。请点右上角 ···，选“在 Safari 中打开”（或“在浏览器打开”），再点下载就正常了。';
  tip.style.display = 'flex';
  $('inappTipClose').addEventListener('click', () => { tip.style.display = 'none'; });
})();

// 下载记录：存本机浏览器，按天分组
function loadHist() {
  try { return JSON.parse(localStorage.getItem('tz_hist') || '[]'); } catch (e) { return []; }
}
function saveHist(h) { localStorage.setItem('tz_hist', JSON.stringify(h.slice(0, 200))); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const full = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  if (dayKey(ts) === dayKey(now.getTime())) return full + ' 今天';
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (dayKey(ts) === dayKey(y.getTime())) return full + ' 昨天';
  return full;
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function renderHist() {
  const h = loadHist();
  const box = $('hist');
  if (!h.length) { box.innerHTML = '<div class="hist-empty">还没有下载记录，下载后会自动记在这里。</div>'; return; }
  const groups = {};
  h.forEach(r => { (groups[dayKey(r.ts)] = groups[dayKey(r.ts)] || []).push(r); });
  const days = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));
  box.innerHTML = days.map(k => {
    const list = groups[k];
    const items = list.map(r => {
      const d = new Date(r.ts);
      const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
      return `<div class="hist-item">
        <div><div class="hist-title">《${escHtml(r.t)}》</div>
        <div class="hist-meta">${escHtml(r.a || '')}${r.a ? ' · ' : ''}${r.w ? r.w + ' 字 · ' : ''}${hh}:${mm}</div></div>
      </div>`;
    }).join('');
    return `<div class="hist-day">${dayLabel(list[0].ts)} · ${list.length} 篇</div>${items}`;
  }).join('');
}
function addHist(r) { const h = loadHist(); h.unshift(r); saveHist(h); renderHist(); }

$('clearHist').addEventListener('click', () => {
  if (confirm('确定清空下载记录吗？')) { saveHist([]); renderHist(); }
});
renderHist();

function setStatus(msg, cls) {
  const el = $('status');
  el.textContent = msg;
  el.className = cls || '';
}

function filenameFromHeaders(res, fallback) {
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
  if (m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
  const m2 = cd.match(/filename="?([^";]+)"?/i);
  if (m2) return m2[1];
  return fallback;
}

// 从一段话里自动抠出番茄分享链接（用户常直接粘贴带推荐语的整段文字）
function extractLink(text) {
  if (!text) return '';
  const m = text.match(/https?:\/\/changdunovel\.com\/t\/[A-Za-z0-9_\-]+/i)
    || text.match(/changdunovel\.com\/t\/[A-Za-z0-9_\-]+/i)
    || text.match(/https?:\/\/[^\s"'<>]+/);
  if (!m) return '';
  let u = m[0];
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

// 粘贴后自动把链接抠出来留在框里，多余的文字去掉
$('link').addEventListener('input', () => {
  const v = $('link').value;
  const u = extractLink(v);
  if (u && u !== v.trim()) $('link').value = u;
});

// 粘贴键：读剪贴板 → 填进输入框 → 直接开始下载，不用点输入框
$('paste').addEventListener('click', async () => {
  let text = '';
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      setStatus('当前浏览器不支持一键粘贴，请点输入框手动粘贴。', 'err');
      $('link').focus();
      return;
    }
    text = await navigator.clipboard.readText();
  } catch (e) {
    setStatus('没拿到剪贴板权限，请点输入框手动粘贴（或在浏览器设置里允许剪贴板访问）。', 'err');
    $('link').focus();
    return;
  }
  const link = extractLink((text || '').trim());
  if (!link) {
    setStatus('剪贴板里没有番茄分享链接，先去番茄 App 复制一个。', 'err');
    return;
  }
  $('link').value = link;
  $('dl').click();
});

// 清除键：清空输入框和提示
$('clear').addEventListener('click', () => {
  $('link').value = '';
  setStatus('', '');
  $('link').focus();
});

$('dl').addEventListener('click', async () => {
  const link = extractLink($('link').value.trim());
  if (!link) { setStatus('先粘贴一个分享链接。', 'err'); return; }
  if (!WORKER_URL) { setStatus('中转服务还没配好（WORKER_URL 为空），联系管理员部署 Worker。', 'err'); return; }
  const btn = $('dl');
  btn.disabled = true;
  btn.textContent = '下载中…';
  setStatus('正在拿全文，请稍等…');
  try {
    const res = await fetch(WORKER_URL + '?url=' + encodeURIComponent(link));
    if (!res.ok) {
      let msg = '下载失败（' + res.status + '）';
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    let title = decodeURIComponent(res.headers.get('X-Title') || '');
    let author = decodeURIComponent(res.headers.get('X-Author') || '');
    let words = res.headers.get('X-Words') || '';
    const name = filenameFromHeaders(res, (title || '小说') + (author ? '_' + author : '') + '.txt');
    // 响应头读不到时（比如 Worker 还没更新），从文件名反推书名/作者
    if (!title || !author) {
      const base = name.replace(/\.txt$/i, '');
      const i = base.lastIndexOf('_');
      if (i > 0) { if (!title) title = base.slice(0, i); if (!author) author = base.slice(i + 1); }
    }
    if (!words) { try { words = String((await blob.text()).length); } catch (e) {} }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    setStatus(`✅ 已下载：《${title}》 作者：${author}  共 ${words} 字\n文件：${name}`, 'ok');
    if (title) addHist({ t: title, a: author, w: words, ts: Date.now() });
  } catch (e) {
    setStatus('❌ ' + (e.message || '下载失败，请检查链接后重试。'), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '下载全文';
  }
});

$('link').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dl').click(); });
</script>
</body>
</html>
